name: tests

# Runs when this project's own `develop` is pushed, and on a pull request.
# `main` is covered by `release.yml`, which calls this workflow and then decides
# whether the version is worth publishing; a `push:` trigger for main here as
# well would run the whole matrix twice for every push to it.
#
# Nothing here triggers on a sibling project's push. What a CI run is for is the
# change that was just made to *this* repository; the stack is tested together
# in the development workspace, on real hardware, where the whole suite can
# actually run.
on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    name: ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tox
        run: python -m pip install --upgrade pip tox

      # The engine is installed from PyPI, pre-releases included -- `pip_pre` in
      # the [tool.tox.env_run_base] table -- so a green run says the demo works
      # with an OpenGLContext somebody can actually install, rather than with
      # the checkout next door. The tests open no GL context, so a runner with
      # no graphics runs all of them.
      - name: Run tox
        run: tox run -e py$(echo "${{ matrix.python-version }}" | tr -d '.')

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --pre -e ".[dev]"
      - name: ruff
        run: python -m ruff check src tests
      - name: mypy
        run: python -m mypy --follow-imports=silent src/openglcontext_forest_demo

  # `requires-python = ">=3.10"` and the OpenGLContext floor are claims about
  # installing, not about the test matrix, so they are checked where a user
  # meets them: a plain install of the built sdist, imported from somewhere that
  # is not the checkout.
  install:
    name: sdist installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Build and install the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
          python -m pip install --pre dist/*.tar.gz
      - name: Import it from somewhere that is not the checkout
        run: cd /tmp && python -c "import openglcontext_forest_demo as f; print(f.__version__)"
